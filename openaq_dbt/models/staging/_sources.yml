version: 2

sources:
  - name: openaq
    description: Data mentah OpenAQ API v3, dimuat oleh Handler/loader.py (DAG openaq_ingest).
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 4, period: day}
    tables:
      - name: locations
        columns:
          - name: location_id
            data_tests: [unique, not_null]
      - name: sensors
        columns:
          - name: sensor_id
            data_tests: [unique, not_null]
      - name: measurements_hourly
        # Ukur kebaruan DATA (jam pengukuran terakhir), bukan kapan loader jalan:
        # loader bisa sukses tapi API tidak mengirim jam baru. Normalnya telat ~2 jam.
        config:
          loaded_at_field: datetime_from_utc
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}
        columns:
          - name: sensor_id
            data_tests: [not_null]
